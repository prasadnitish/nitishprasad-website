name: Validate portfolio demo evidence

on:
  pull_request:
    paths:
      - ".github/workflows/validate-portfolio-evidence.yml"
      - "ai-safety/**"
      - "demos/**"
      - "evals/**"
      - "evidence/**"
      - "scripts/sync-portfolio-evidence.mjs"
      - "tests/**"
      - "index.html"
      - "project-*.html"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-portfolio-evidence.yml"
      - "ai-safety/**"
      - "demos/**"
      - "evals/**"
      - "evidence/**"
      - "scripts/sync-portfolio-evidence.mjs"
      - "tests/**"
      - "index.html"
      - "project-*.html"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
